name: Generate snake

# 每日刷新由外部定时器调用 workflow_dispatch 触发，配置见 profile-stats.yml 文末
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ldm0715
          outputs: |
            dist/github-snake.svg?color_snake=#0969DA&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#6E7781

      # 生成到仓库里而不是单独分支，README 用相对路径引用，省掉一个分支
      # 注意：相对路径最终仍会 302 跳到 raw.githubusercontent.com，绕不开该域名
      - name: Add dark-mode override
        run: python scripts/snake_dark.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --staged --quiet; then
            echo "蛇图无变化，跳过提交"
          else
            git commit -m "chore: update contribution snake"
            git pull --rebase origin main
            git push
          fi
