name: Generate snake

on:
  schedule:
    # 每天 03:27 UTC 刷新一次
    - cron: "27 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ldm0715
          outputs: |
            dist/github-snake.svg?color_snake=#1F883D&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#6E7781
            dist/github-snake-dark.svg?color_snake=#3FB950&color_dots=#21262D,#30363D,#484F58,#6E7681,#8B949E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
